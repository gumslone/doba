name: Bug report
description: Something does the wrong thing
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Please do **not** file it here — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Doba version
      description: Shown at the bottom of Admin → Update.
      placeholder: v0.3.0
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [SQLite, MySQL, MariaDB, Not sure]
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version and hosting
      placeholder: PHP 8.4 on shared hosting at …
  - type: textarea
    id: logs
    attributes:
      label: Anything from storage/logs/laravel.log
      description: Remove guest names and email addresses first.
      render: text
