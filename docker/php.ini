; Photos arrive from phones: a 12 MB JPEG is ordinary.
upload_max_filesize = 32M
post_max_size = 40M
memory_limit = 256M
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; The code in an image never changes, so never stat it.
opcache.validate_timestamps = 0
